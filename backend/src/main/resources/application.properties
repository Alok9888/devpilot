
spring.application.name=devPilot
server.port=${PORT:8080}

# Render terminates HTTPS at its proxy.
server.forward-headers-strategy=framework

# PostgreSQL - Neon
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Groq chat through its OpenAI-compatible endpoint
spring.ai.model.chat=openai
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.max-retries=0
spring.ai.retry.max-attempts=1
app.groq.chat.models=${GROQ_CHAT_MODELS:openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b}

# Last-resort chat generation uses Gemini
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash

# NVIDIA embeddings for repository indexing and semantic search
spring.ai.model.embedding=openai
spring.ai.openai.embedding.base-url=https://integrate.api.nvidia.com/v1
spring.ai.openai.embedding.api-key=${NV_API_KEY}
spring.ai.openai.embedding.model=nvidia/nemotron-3.5-embed-1b
spring.ai.openai.embedding.dimensions=768

# Use separate table for NVIDIA embeddings (old Gemini table remains untouched)
spring.ai.vectorstore.pgvector.table-name=devpilot_vectors_nv_768
spring.ai.vectorstore.pgvector.dimensions=768

# GitHub API access is optional; public repositories also work without a token.
github.token=${GITHUB_TOKEN:}

# CORS and frontend
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# Database and PGVector
spring.jpa.hibernate.ddl-auto=update
spring.ai.vectorstore.pgvector.initialize-schema=true

# Use HNSW index for faster semantic search (vector distance queries)
spring.ai.vectorstore.pgvector.index-type=hnsw


spring.main.lazy-initialization=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

management.endpoints.web.exposure.include=health,info
