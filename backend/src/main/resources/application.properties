
spring.application.name=devPilot
server.port=${PORT:8080}

# Render terminates HTTPS at its proxy.
server.forward-headers-strategy=framework

# PostgreSQL - Neon
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Gemini Cloud chat
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.8-flash

# Gemini embeddings for repository indexing and semantic search
spring.ai.model.embedding=google-genai
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768
spring.ai.google.genai.embedding.text.task-type=SEMANTIC_SIMILARITY

# Use a new table so vectors from the previous embedding model remain untouched
spring.ai.vectorstore.pgvector.table-name=devpilot_vectors_gemini
spring.ai.vectorstore.pgvector.dimensions=768

# GitHub API access is optional; public repositories also work without a token.
github.token=${GITHUB_TOKEN:}

# CORS and frontend
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# Database and PGVector
spring.jpa.hibernate.ddl-auto=update
spring.ai.vectorstore.pgvector.initialize-schema=true


spring.main.lazy-initialization=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

management.endpoints.web.exposure.include=health,info
